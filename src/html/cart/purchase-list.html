<section class="section cart">
    <!-- for test header theme -->
    <div data-theme="dark"></div>

    <div class="container">
        <div class="cart-hero">
            <h1 class="cart-hero-title h1" data-load-order="1">Shopping Cart</h1>
            <div class="cart-hero-text" data-load-order="2">
                Lorem ipsum dolor sit amet consectetur. Sit risus sed integer a at.
            </div>
        </div>
        <div class="cart-empty" data-load-order="3">
            <h5 class="cart-empty-title">Your cart is currently empty.</h5>
        </div>
        <div class="purchase-list" data-load-order="3">
            <table class="purchase-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-product-id="1">
                        <td class="purchase-image-wrapper">
                            <a href="#" class="purchase-icon-decs">
                                <img src="../../img/cart/del.svg" alt="icon" />
                            </a>
                            <a href="#" class="purchase-icon-mob">
                                <img src="../../img/cart/Close.svg" alt="icon" />
                            </a>
                            <a href="#" class="purchase-image">
                                <img src="../../img/cart/image.jpg" alt="product`s photo" />
                            </a>
                        </td>
                        <td data-label="Product">
                            <a href="#" class="purchase-name">Planar Transformers</a>
                        </td>
                        <td data-label="Price" class="purchase-price">
                            <p>$1,000.00 <span>$2,000.00</span></p>
                        </td>
                        <td data-label="Quantity" class="purchase-quantity">
                            <div class="purchase-quantity-wrapper">
                                <img
                                    class="qty-minus"
                                    src="../../img/cart/tabler_minus.svg"
                                    alt="icon"
                                />
                                <input type="number" value="1" min="1" readonly />
                                <img
                                    class="qty-plus"
                                    src="../../img/cart/tabler_plus.svg"
                                    alt="icon"
                                />
                            </div>
                        </td>
                        <td data-label="Subtotal" class="subtotal">$1,000.00</td>
                    </tr>
                    <tr data-product-id="2">
                        <td class="purchase-image-wrapper">
                            <img
                                class="purchase-icon-decs"
                                src="../../img/cart/del.svg"
                                alt="icon"
                            />
                            <img
                                class="purchase-icon-mob"
                                src="../../img/cart/Close.svg"
                                alt="icon"
                            />
                            <img
                                class="purchase-image"
                                src="../../img/cart/image.jpg"
                                alt="product`s photo"
                            />
                        </td>
                        <td data-label="Product">
                            <a href="#" class="purchase-name">Planar Transformers</a>
                        </td>
                        <td data-label="Price" class="purchase-price">
                            <p>$1,000.00 <span>$2,000.00</span></p>
                        </td>
                        <td data-label="Quantity" class="purchase-quantity">
                            <div class="purchase-quantity-wrapper">
                                <img
                                    class="qty-minus"
                                    src="../../img/cart/tabler_minus.svg"
                                    alt="icon"
                                />
                                <input type="number" value="1" min="1" readonly />
                                <img
                                    class="qty-plus"
                                    src="../../img/cart/tabler_plus.svg"
                                    alt="icon"
                                />
                            </div>
                        </td>
                        <td data-label="Subtotal" class="subtotal">$1,000.00</td>
                    </tr>
                </tbody>
            </table>

            <div class="purchase-bottom">
                <div class="purchase-coupone">
                    <input type="text" placeholder="Enter coupon code" />
                    <button type="button" class="btn btn-line" data-modal-open="#contact-modal">
                        Apply cupon
                    </button>
                </div>
                <div class="purchase-total">
                    <div class="purchase-total-info">
                        <h4 class="purchase-total-text h4">Total</h4>
                        <p class="purchase-total-number">$2,000.00</p>
                    </div>
                    <button type="button" class="btn btn-secondary">Proceed to checkout</button>
                </div>
            </div>
        </div>
    </div>
</section>
